[package]
name = "novaterm"
version = "0.1.0"
edition = "2021"
description = "Terminal emulator core for NovaTerm (Android): PTY, VT/xterm parser, screen buffer"
license = "MIT"

# Zero external dependencies: JNI and libc bindings are declared by hand,
# so the core builds and tests fully offline.
[dependencies]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
